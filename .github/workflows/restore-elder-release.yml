MANIFEST
          base='https://sb-4prl4n6pstf6.vercel.run/export'
          while read -r expected file; do
            test -n "$file"
            mkdir -p "$(dirname "$file")"
            curl --fail --silent --show-error --retry 4 --retry-delay 2 "$base/$file" --output "$file"
            actual="$(sha256sum "$file" | cut -d ' ' -f1)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Checksum mismatch for $file: expected $expected got $actual" >&2
              exit 1
            fi
            echo "Verified $file"
          done < /tmp/verified-release.sha256
      - name: Run full validation
        run: |
          npm ci
          npm test
          npm run lint
          npm run check:village
      - name: Remove temporary branch sync files and push corrected feature branch
        run: |
          set -euo pipefail
          rm .github/workflows/restore-elder-release.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore complete verified Elder release sources'
          git push origin HEAD:work/elder-scroll-challenge
# Trigger follow-up after workflow registration.
