name: Temporary restore of verified Elder release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-elder-release.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/elder-scroll-challenge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore complete verified files
