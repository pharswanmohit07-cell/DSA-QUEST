<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Map tiles</title>
    <style>
      body { margin: 0; background: #101828; color: #e6edf7; font: 11px/1.3 monospace; }
      #wrap { display: flex; gap: 12px; padding: 8px; }
      canvas { image-rendering: pixelated; border: 1px solid #2a3a55; }
      .title { color: #93c5fd; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div>
        <div class="title" id="regionTitle"></div>
        <canvas id="region"></canvas>
      </div>
      <div>
        <div class="title">distinct obstacle tiles in that region, 8x</div>
        <canvas id="tiles"></canvas>
      </div>
    </div>
    <script>
      const MAP_URL = '/src/assets/tiles/ninja-village/MAP.json'
      const TILE_DIR = '/src/assets/tiles/ninja-village/'
      const REGION = { left: 10, right: 20, top: 20, bottom: 25 }
      const REGION_SCALE = 5
      const TILE_SCALE = 8

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image()
          image.onload = () => resolve(image)
          image.onerror = () => reject(new Error('failed to load ' + src))
          image.src = src
        })
      }

      async function main() {
        const mapJson = await (await fetch(MAP_URL)).json()
        const width = mapJson.width
        const height = mapJson.height
        const tileSize = mapJson.tilewidth

        const tilesets = []
        for (const entry of mapJson.tilesets) {
          const name = String(entry.source).replace(/^.*[/\\]/, '').replace(/\.tsx$/i, '')
          const image = await loadImage(TILE_DIR + name + '.png')
          tilesets.push({
            firstgid: entry.firstgid,
            name,
            image,
            columns: Math.floor(image.width / tileSize),
          })
        }
        tilesets.sort((a, b) => a.firstgid - b.firstgid)
        const tilesetFor = (gid) => {
          let found = null
          for (const tileset of tilesets) if (gid >= tileset.firstgid) found = tileset
          return found
        }
        const sourceOf = (gid) => {
          const tileset = tilesetFor(gid)
          if (!tileset) return null
          const index = gid - tileset.firstgid
          return {
            tileset,
            sx: (index % tileset.columns) * tileSize,
            sy: Math.floor(index / tileset.columns) * tileSize,
          }
        }

        const layers = Object.fromEntries(
          mapJson.layers
            .filter((layer) => Array.isArray(layer.data))
            .map((layer) => [layer.name, layer.data]),
        )
        const ground = layers['0_Ground']
        const obstacles = layers['1_Obstacles']

        const columns = REGION.right - REGION.left + 1
        const rows = REGION.bottom - REGION.top + 1
        const region = document.getElementById('region')
        region.width = columns * tileSize * REGION_SCALE
        region.height = rows * tileSize * REGION_SCALE
        const regionCtx = region.getContext('2d')
        regionCtx.imageSmoothingEnabled = false
        regionCtx.fillStyle = '#ff00ff'
        regionCtx.fillRect(0, 0, region.width, region.height)

        function drawRegionLayer(data) {
          for (let tileY = REGION.top; tileY <= REGION.bottom; tileY += 1) {
            for (let tileX = REGION.left; tileX <= REGION.right; tileX += 1) {
              const gid = data[tileY * width + tileX]
              if (!gid) continue
              const source = sourceOf(gid)
              if (!source) continue
              regionCtx.drawImage(
                source.tileset.image,
                source.sx, source.sy, tileSize, tileSize,
                (tileX - REGION.left) * tileSize * REGION_SCALE,
                (tileY - REGION.top) * tileSize * REGION_SCALE,
                tileSize * REGION_SCALE, tileSize * REGION_SCALE,
              )
            }
          }
        }
        drawRegionLayer(ground)
        drawRegionLayer(obstacles)

        regionCtx.strokeStyle = 'rgba(255,255,255,0.3)'
        regionCtx.font = '12px monospace'
        regionCtx.fillStyle = '#ff0'
        for (let tileY = REGION.top; tileY <= REGION.bottom; tileY += 1) {
          for (let tileX = REGION.left; tileX <= REGION.right; tileX += 1) {
            const px = (tileX - REGION.left) * tileSize * REGION_SCALE
            const py = (tileY - REGION.top) * tileSize * REGION_SCALE
            regionCtx.strokeRect(px, py, tileSize * REGION_SCALE, tileSize * REGION_SCALE)
            regionCtx.fillText(tileX + ',' + tileY, px + 2, py + 13)
          }
        }
        document.getElementById('regionTitle').textContent =
          'composited region x' + REGION.left + '-' + REGION.right + ' y' + REGION.top + '-' + REGION.bottom + ' (magenta = nothing drawn)'

        // Distinct obstacle gids in the region, drawn at 8x.
        const gids = []
        for (let tileY = REGION.top; tileY <= REGION.bottom; tileY += 1) {
          for (let tileX = REGION.left; tileX <= REGION.right; tileX += 1) {
            const gid = obstacles[tileY * width + tileX]
            if (gid && !gids.includes(gid)) gids.push(gid)
          }
        }

        const cell = tileSize * TILE_SCALE
        const perRow = 6
        const tiles = document.getElementById('tiles')
        tiles.width = perRow * cell + 8
        tiles.height = Math.ceil(gids.length / perRow) * (cell + 22) + 8
        const tileCtx = tiles.getContext('2d')
        tileCtx.imageSmoothingEnabled = false
        tileCtx.fillStyle = '#161616'
        tileCtx.fillRect(0, 0, tiles.width, tiles.height)
        tileCtx.font = '11px monospace'

        gids.forEach((gid, position) => {
          const col = position % perRow
          const row = Math.floor(position / perRow)
          const x = 4 + col * cell
          const y = 4 + row * (cell + 22)
          const source = sourceOf(gid)
          if (source) {
            tileCtx.drawImage(source.tileset.image, source.sx, source.sy, tileSize, tileSize, x, y, cell, cell)
          }
          tileCtx.strokeStyle = '#3b4a63'
          tileCtx.strokeRect(x, y, cell, cell)
          tileCtx.fillStyle = '#ff0'
          tileCtx.fillText('gid ' + gid, x, y + cell + 11)
          tileCtx.fillStyle = '#9fb3d1'
          tileCtx.fillText(
            source ? source.tileset.name.replace('Tileset', '') + ' (' + source.sx / tileSize + ',' + source.sy / tileSize + ')' : '-',
            x, y + cell + 21,
          )
        })
      }

      main().catch((error) => {
        document.body.insertAdjacentHTML('beforeend', '<pre>ERROR: ' + error.message + '</pre>')
      })
    </script>
  </body>
</html>
